appId: com.vigosan.cuts
productName: Cuts
directories:
  output: dist
files:
  - out/**
  - package.json
extraFiles:
  - from: resources/ffmpeg/ffmpeg
    to: Helpers/ffmpeg
extraResources:
  - from: resources/ffmpeg/LICENSE-FFmpeg.txt
    to: LICENSE-FFmpeg.txt
  - from: resources/ffmpeg/BUILD-FFmpeg.txt
    to: BUILD-FFmpeg.txt
mac:
  target: dir
  icon: build/icon.icns
  x64ArchFiles: Contents/Helpers/ffmpeg
  category: public.app-category.video
  electronLanguages:
    - en
    - en_FEMININE
    - en_MASCULINE
    - en_NEUTER
    - en_GB
    - en_GB_FEMININE
    - en_GB_MASCULINE
    - en_GB_NEUTER
    - es
    - es_FEMININE
    - es_MASCULINE
    - es_NEUTER
    - es_419
    - es_419_FEMININE
    - es_419_MASCULINE
    - es_419_NEUTER
mas:
  type: distribution
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
