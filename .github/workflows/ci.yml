name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources/ffmpeg
          key: ffmpeg-linux-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y pkg-config zlib1g-dev
      - if: steps.cache.outputs.cache-hit != 'true'
        run: apps/desktop/scripts/build-ffmpeg.sh linux
      - run: chmod +x apps/desktop/resources/ffmpeg/ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --workspaces
      - run: npm test --workspaces
