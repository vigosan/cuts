name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-14
            args: --mac dmg zip --universal -c.forceCodeSigning=true
            artifact: dist/Cuts-mac.dmg
          - target: linux
            os: ubuntu-latest
            args: --linux AppImage --x64
            artifact: dist/Cuts-linux.AppImage
          - target: windows
            os: windows-latest
            args: --win nsis appx --x64
            artifact: dist/Cuts-windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: apps/desktop/resources/ffmpeg
      - if: matrix.target != 'windows'
        run: chmod +x resources/ffmpeg/ffmpeg
      - run: npm ci
        working-directory: .
      - run: npm run typecheck --workspaces
        working-directory: .
      - run: npm test --workspaces
        working-directory: .
      - run: npm run build
      - if: matrix.target == 'mac'
        run: |
          test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" || { echo "Missing notarization secrets" >&2; exit 1; }
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.target == 'mac' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'mac' && secrets.APPLE_API_ISSUER || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            apps/desktop/${{ matrix.artifact }}
            apps/desktop/dist/Cuts-mac.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
      - if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: store-appx
          path: apps/desktop/dist/Cuts-windows.appx

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo vigosan/cuts-releases --title "Cuts ${GITHUB_REF_NAME#v}" --notes "" Cuts-mac.dmg Cuts-mac.zip Cuts-windows.exe Cuts-linux.AppImage latest*.yml *.blockmap
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: dmg
        run: |
          sha=$(gh release view "$GITHUB_REF_NAME" --repo vigosan/cuts-releases --json assets --jq '.assets[] | select(.name == "Cuts-mac.dmg") | .digest' | sed 's/^sha256://')
          test -n "$sha" || { echo "Missing Cuts-mac.dmg digest" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: vigosan/homebrew-cuts
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - run: |
          sed -i -E "s/  version \"[^\"]+\"/  version \"${GITHUB_REF_NAME#v}\"/; s/  sha256 \"[0-9a-f]{64}\"/  sha256 \"$SHA\"/" Casks/cuts.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -aqm "Update cuts cask to $GITHUB_REF_NAME" || exit 0
          git push
        env:
          SHA: ${{ steps.dmg.outputs.sha }}
