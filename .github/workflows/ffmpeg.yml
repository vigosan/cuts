name: FFmpeg

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [apps/desktop/scripts/build-ffmpeg.sh, .github/workflows/ffmpeg.yml]

permissions:
  contents: read

jobs:
  ffmpeg:
    strategy:
      matrix:
        include:
          - target: mac
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.target != 'mac'
        run: sudo apt-get update && sudo apt-get install -y pkg-config zlib1g-dev mingw-w64
      - if: steps.cache.outputs.cache-hit != 'true'
        run: apps/desktop/scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: apps/desktop/resources/ffmpeg
