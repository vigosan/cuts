name: Warm caches

on:
  push:
    branches: [master]
    paths: [package-lock.json, apps/desktop/scripts/build-ffmpeg.sh, .github/workflows/warm-caches.yml]
  schedule:
    - cron: '0 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
