appId: com.vigosan.cuts
productName: Cuts
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/ffmpeg/LICENSE-FFmpeg.txt
    to: LICENSE-FFmpeg.txt
  - from: resources/ffmpeg/BUILD-FFmpeg.txt
    to: BUILD-FFmpeg.txt
mac:
  target: dir
  icon: build/icon.icns
  artifactName: Cuts-mac.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraFiles:
    - from: resources/ffmpeg/ffmpeg
      to: Helpers/ffmpeg
  x64ArchFiles: Contents/Helpers/ffmpeg
  category: public.app-category.video
  electronLanguages:
    - en
    - en_FEMININE
    - en_MASCULINE
    - en_NEUTER
    - en_GB
    - en_GB_FEMININE
    - en_GB_MASCULINE
    - en_GB_NEUTER
    - es
    - es_FEMININE
    - es_MASCULINE
    - es_NEUTER
    - es_419
    - es_419_FEMININE
    - es_419_MASCULINE
    - es_419_NEUTER
win:
  target: nsis
  icon: build/icon.png
  artifactName: Cuts-windows.${ext}
  extraFiles:
    - from: resources/ffmpeg/ffmpeg.exe
      to: ffmpeg.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: build/icon.png
  category: AudioVideo
  artifactName: Cuts-linux.${ext}
  extraFiles:
    - from: resources/ffmpeg/ffmpeg
      to: ffmpeg
  extraResources:
    - from: resources/ffmpeg/LICENSE-OpenH264.txt
      to: LICENSE-OpenH264.txt
mas:
  type: distribution
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
